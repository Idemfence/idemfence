name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so the audit catches new advisories against unchanged dependencies.
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exact releases of every Active/Maintenance LTS line, each published 14+ days ago.
        node: ["22.23.3", "24.21.0"]
    services:
      postgres:
        # postgres:18.4, pushed 2026-08-06; pinned by manifest-list digest.
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: idemfence
          POSTGRES_PASSWORD: idemfence
          POSTGRES_DB: idemfence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idemfence -d idemfence_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      IDEMFENCE_TEST_DATABASE_URL: postgres://idemfence:idemfence@localhost:5432/idemfence_test
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Apply the Postgres migration
        run: psql "$IDEMFENCE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/idemfence/migrations/001_init.sql

      # After Build: some tests run against the built package in dist/.
      - name: Test
        run: pnpm test

      - name: Artifact tests (packed tarball)
        run: node scripts/artifact-test.mjs

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check dependency licenses
        run: node scripts/check-licenses.mjs

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

  reference-app:
    name: reference-app
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate secrets for this run
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "IDEMFENCE_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the conformance CLI
        run: pnpm exec tsc --build packages/conformance/tsconfig.json

      - name: Build and start the stack
        run: docker compose -f reference-app/compose.yaml up -d --build --wait

      - name: Smoke test
        run: bash reference-app/smoke.sh

      - name: Conformance (must pass)
        run: node packages/conformance/dist/cli.js --url http://127.0.0.1:3000 --config reference-app/conformance.json --require-all

      - name: Conformance against the non-conforming routes (must fail)
        run: |
          set +e
          node packages/conformance/dist/cli.js --url http://127.0.0.1:3000 --config reference-app/conformance.nonconforming.json --json > nonconforming.json
          status=$?
          set -e
          node packages/conformance/dist/cli.js --url http://127.0.0.1:3000 --config reference-app/conformance.nonconforming.json || true
          if [ "$status" -eq 0 ]; then echo "::error::the non-conforming run exited 0"; exit 1; fi
          jq -e '.results[] | select(.row == "6") | select(.outcome == "fail") | select(.messages | join(" ") | test("duplicate side effect"))' nonconforming.json >/dev/null \
            || { echo "::error::row 6 did not report a duplicate side effect"; exit 1; }
          echo "non-conforming run exited $status and row 6 reported a duplicate side effect"

      - name: Conformance, Concurrency group (1000 x 50)
        run: node packages/conformance/dist/cli.js --url http://127.0.0.1:3000 --config reference-app/conformance.json --group concurrency

      - name: Show logs on failure
        if: ${{ failure() }}
        run: docker compose -f reference-app/compose.yaml logs --no-color

      - name: Tear down
        if: ${{ always() }}
        run: docker compose -f reference-app/compose.yaml down -v

  # Mirrors release.yml's three jobs without the OIDC token: the stage is a --dry-run of the
  # uploaded tarball and no release is created.
  release-dry-run-build:
    name: release-dry-run-build
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
      node: ${{ steps.node.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Read the Node.js version for the stage job
        id: node
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Artifact tests (packed tarball)
        run: node scripts/artifact-test.mjs

      - name: Decide whether release.yml would publish
        id: decide
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/idemfence/package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if view=$(npm view "idemfence@${version}" version 2>&1); then
            echo "idemfence@${version} is already on npm; release.yml would skip"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif ! grep -q "E404" <<<"${view}"; then
            echo "::error::could not determine whether idemfence@${version} is on npm:"
            echo "${view}"
            exit 1
          fi
          if ! grep -qxF "## ${version}" packages/idemfence/CHANGELOG.md 2>/dev/null; then
            echo "idemfence@${version} has no CHANGELOG entry (not produced by changeset version); release.yml would skip"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "idemfence@${version} is new and has a CHANGELOG entry; release.yml would stage it"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Pack
        id: pack
        working-directory: packages/idemfence
        run: |
          set -euo pipefail
          pnpm pack --pack-destination "$RUNNER_TEMP/tarball"
          tarball=$(ls "$RUNNER_TEMP/tarball")
          sha256=$(sha256sum "$RUNNER_TEMP/tarball/${tarball}" | cut -d ' ' -f 1)
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          echo "packed ${tarball} sha256 ${sha256}"

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: idemfence-tarball-dry-run
          path: ${{ runner.temp }}/tarball/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  release-dry-run-stage:
    name: release-dry-run-stage
    needs: release-dry-run-build
    runs-on: ubuntu-latest
    env:
      TARBALL: ${{ needs.release-dry-run-build.outputs.tarball }}
      SHA256: ${{ needs.release-dry-run-build.outputs.sha256 }}
    steps:
      # No checkout, install, build or repository script: only the uploaded tarball.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.release-dry-run-build.outputs.node }}
          registry-url: https://registry.npmjs.org

      - name: Install npm 11.21.0
        run: npm install -g npm@11.21.0 && npm --version

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: idemfence-tarball-dry-run
          path: tarball

      - name: Verify the tarball's sha256
        run: echo "${SHA256}  tarball/${TARBALL}" | sha256sum -c -

      - name: npm stage publish --dry-run of the uploaded tarball
        run: npm stage publish --dry-run "./tarball/${TARBALL}"

  release-dry-run-notes:
    name: release-dry-run-notes
    needs: [release-dry-run-build, release-dry-run-stage]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release-dry-run-build.outputs.version }}
      PUBLISH: ${{ needs.release-dry-run-build.outputs.publish }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the release notes release.yml would use (no release is created)
        run: |
          echo "release.yml would publish idemfence@${VERSION}: ${PUBLISH}"
          if [ -f packages/idemfence/CHANGELOG.md ]; then
            awk -v v="## ${VERSION}" '$0 == v {p=1; next} p && /^## / {exit} p' packages/idemfence/CHANGELOG.md
          else
            echo "(no CHANGELOG.md yet)"
          fi

  ci:
    name: ci
    if: ${{ always() }}
    needs:
      [
        check,
        licenses,
        audit,
        reference-app,
        release-dry-run-build,
        release-dry-run-stage,
        release-dry-run-notes,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<< "${NEEDS}")
          if [ -n "${failed}" ]; then
            echo "::error::Jobs did not all succeed: $(echo ${failed})"
            exit 1
          fi
          echo "All jobs succeeded: $(jq -r 'keys | join(", ")' <<< "${NEEDS}")."
