name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so the audit catches new advisories against unchanged dependencies.
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exact releases of every Active/Maintenance LTS line, each published 14+ days ago.
        node: ["22.23.3", "24.21.0"]
    services:
      postgres:
        # postgres:18.4, pushed 2026-08-06; pinned by manifest-list digest.
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: idemfence
          POSTGRES_PASSWORD: idemfence
          POSTGRES_DB: idemfence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idemfence -d idemfence_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      IDEMFENCE_TEST_DATABASE_URL: postgres://idemfence:idemfence@localhost:5432/idemfence_test
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Apply the Postgres migration
        run: psql "$IDEMFENCE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/idemfence/migrations/001_init.sql

      # After Build: some tests run against the built package in dist/.
      - name: Test
        run: pnpm test

      - name: Artifact tests (packed tarball)
        run: node scripts/artifact-test.mjs

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check dependency licenses
        run: node scripts/check-licenses.mjs

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

  reference-app:
    name: reference-app
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate secrets for this run
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "IDEMFENCE_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the conformance CLI
        run: pnpm exec tsc --build packages/conformance/tsconfig.json

      - name: Build and start the stack
        run: docker compose -f reference-app/compose.yaml up -d --build --wait

      - name: Smoke test
        run: bash reference-app/smoke.sh

      - name: Conformance (must pass)
        run: node packages/conformance/dist/cli.js --url http://127.0.0.1:3000 --config reference-app/conformance.json --require-all

      - name: Conformance against the non-conforming routes (must fail)
        run: |
          set +e
          node packages/conformance/dist/cli.js --url http://127.0.0.1:3000 --config reference-app/conformance.nonconforming.json --json > nonconforming.json
          status=$?
          set -e
          node packages/conformance/dist/cli.js --url http://127.0.0.1:3000 --config reference-app/conformance.nonconforming.json || true
          if [ "$status" -eq 0 ]; then echo "::error::the non-conforming run exited 0"; exit 1; fi
          jq -e '.results[] | select(.row == "6") | select(.outcome == "fail") | select(.messages | join(" ") | test("duplicate side effect"))' nonconforming.json >/dev/null \
            || { echo "::error::row 6 did not report a duplicate side effect"; exit 1; }
          echo "non-conforming run exited $status and row 6 reported a duplicate side effect"

      - name: Conformance, Concurrency group (1000 x 50)
        run: node packages/conformance/dist/cli.js --url http://127.0.0.1:3000 --config reference-app/conformance.json --group concurrency

      - name: Show logs on failure
        if: ${{ failure() }}
        run: docker compose -f reference-app/compose.yaml logs --no-color

      - name: Tear down
        if: ${{ always() }}
        run: docker compose -f reference-app/compose.yaml down -v

  # Everything the publish job in release.yml does, minus the OIDC token and the staging itself.
  release-dry-run:
    name: release-dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Install npm 11.21.0
        run: npm install -g npm@11.21.0 && npm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Artifact tests (packed tarball)
        run: node scripts/artifact-test.mjs

      - name: npm stage publish --dry-run
        working-directory: packages/idemfence
        run: npm stage publish --dry-run

  ci:
    name: ci
    if: ${{ always() }}
    needs: [check, licenses, audit, reference-app, release-dry-run]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<< "${NEEDS}")
          if [ -n "${failed}" ]; then
            echo "::error::Jobs did not all succeed: $(echo ${failed})"
            exit 1
          fi
          echo "All jobs succeeded: $(jq -r 'keys | join(", ")' <<< "${NEEDS}")."
