name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: dco
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Signed-off-by trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          commits=$(git rev-list --reverse "${BASE_SHA}..${HEAD_SHA}")
          if [ -z "${commits}" ]; then
            echo "No commits in ${BASE_SHA}..${HEAD_SHA}."
            exit 0
          fi

          failed=0
          for sha in ${commits}; do
            author=$(git log -1 --format='%an <%ae>' "${sha}")
            author_email=$(git log -1 --format='%ae' "${sha}")
            # Dependabot cannot sign off. Skip a commit only when Dependabot opened the PR (not
            # forgeable) AND authored the commit, so human commits pushed onto its PRs are checked.
            if [ "${PR_USER}" = "dependabot[bot]" ] \
              && [ "${author_email}" = "49699333+dependabot[bot]@users.noreply.github.com" ]; then
              echo "skip    ${sha} ${author} (Dependabot commit on a Dependabot pull request)"
              continue
            fi
            signoffs=$(git log -1 --format='%(trailers:key=Signed-off-by,valueonly,unfold)' "${sha}" \
              | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if printf '%s\n' "${signoffs}" | grep -Fxq -- "${author}"; then
              echo "ok      ${sha} ${author}"
            else
              echo "missing ${sha} ${author}"
              echo "::error::Commit ${sha} has no 'Signed-off-by:' trailer matching its author (${author})."
              failed=1
            fi
          done

          if [ "${failed}" -ne 0 ]; then
            echo
            echo "Every commit must be signed off by its author. See CONTRIBUTING.md."
            echo "Fix with 'git rebase --signoff ${BASE_SHA}' and force-push."
            exit 1
          fi

      - name: Check for tool attribution trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          failed=0
          for sha in $(git rev-list --reverse "${BASE_SHA}..${HEAD_SHA}"); do
            # Flag a Co-authored-by trailer naming Claude or carrying an @anthropic.com email, and
            # any "Generated with Claude Code" text. Matching is case-insensitive.
            hits=$(git log -1 --format=%B "${sha}" | awk '
              {
                low = tolower($0)
                if (low ~ /generated with claude code/) { print; next }
                if (low !~ /^[[:space:]]*co-authored-by:/) next
                value = substr(low, index(low, ":") + 1)
                name = value
                sub(/<.*/, "", name)
                email = ""
                if (match(value, /<[^>]*>/)) email = substr(value, RSTART + 1, RLENGTH - 2)
                if (name ~ /claude/ || email ~ /@anthropic\.com$/) print
              }')
            if [ -z "${hits}" ]; then
              echo "ok      ${sha}"
              continue
            fi
            while IFS= read -r line; do
              echo "found   ${sha} ${line}"
              echo "::error::Commit ${sha} carries a tool attribution line: ${line}"
            done <<< "${hits}"
            failed=1
          done

          if [ "${failed}" -ne 0 ]; then
            echo
            echo "Drop each listed line from its commit message (git commit --amend for the last commit, or 'git rebase -i ${BASE_SHA}' and reword), keep the Signed-off-by trailer, and force-push."
            exit 1
          fi
