name: Release

# Stages a new idemfence version on npm (trusted publishing, OIDC) and drafts the GitHub release.
# Nothing is published or tagged by this workflow alone: the maintainer approves the staged
# package on npm with 2FA and publishes the draft release, which creates the tag.
#
# Publish rule: a push to main publishes only when packages/idemfence's version is not on npm
# yet AND has a matching heading in packages/idemfence/CHANGELOG.md, i.e. the version was
# produced by `changeset version`. The manually bootstrapped 0.0.0 has no CHANGELOG entry, so
# CI never publishes it.
#
# Least privilege: `build` (read-only) produces and uploads the tarball; `publish` (id-token
# only, environment npm-release) stages exactly that tarball after verifying its sha256, with
# no repository checkout, no dependency install, no build and no repository script;
# `draft-release` (contents: write) only creates the draft release.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
      node: ${{ steps.node.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Read the Node.js version for the publish job
        id: node
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Artifact tests (packed tarball)
        run: node scripts/artifact-test.mjs

      - name: Decide whether to publish
        id: decide
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/idemfence/package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if view=$(npm view "idemfence@${version}" version 2>&1); then
            echo "idemfence@${version} is already on npm; skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif ! grep -q "E404" <<<"${view}"; then
            echo "::error::could not determine whether idemfence@${version} is on npm:"
            echo "${view}"
            exit 1
          fi
          if ! grep -qxF "## ${version}" packages/idemfence/CHANGELOG.md 2>/dev/null; then
            echo "idemfence@${version} has no CHANGELOG entry (not produced by changeset version); skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "idemfence@${version} is new and has a CHANGELOG entry; staging it"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Pack
        id: pack
        working-directory: packages/idemfence
        run: |
          set -euo pipefail
          pnpm pack --pack-destination "$RUNNER_TEMP/tarball"
          tarball=$(ls "$RUNNER_TEMP/tarball")
          sha256=$(sha256sum "$RUNNER_TEMP/tarball/${tarball}" | cut -d ' ' -f 1)
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          echo "packed ${tarball} sha256 ${sha256}"

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: idemfence-tarball
          path: ${{ runner.temp }}/tarball/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    if: ${{ needs.build.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      id-token: write
    env:
      TARBALL: ${{ needs.build.outputs.tarball }}
      SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      # No checkout: this job touches nothing but the tarball the build job produced.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.build.outputs.node }}
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm CLI >= 11.15.0 (trusted publishing >= 11.5.1).
      - name: Install npm 11.21.0
        run: npm install -g npm@11.21.0 && npm --version

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: idemfence-tarball
          path: tarball

      - name: Verify the tarball's sha256
        run: echo "${SHA256}  tarball/${TARBALL}" | sha256sum -c -

      - name: Stage publish on npm (trusted publishing)
        run: npm stage publish "./tarball/${TARBALL}"

  draft-release:
    name: draft-release
    needs: [build, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract the CHANGELOG section
        run: |
          awk -v v="## ${VERSION}" '$0 == v {p=1; next} p && /^## / {exit} p' packages/idemfence/CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Draft the GitHub release (no tag until the maintainer publishes it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "idemfence@${VERSION}" --draft --target "${GITHUB_SHA}" \
            --title "idemfence@${VERSION}" --notes-file release-notes.md
